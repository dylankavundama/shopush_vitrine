  <!-- Google Translate Script -->

<body>
  <!-- Hidden Google Translate Element -->
  <div id="google_translate_element" style="display:none"></div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        // Désactiver le Service Worker et vider le cache en développement local
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister().then((success) => {
              if (success) console.log('[PWA] Service Worker désenregistré en local');
            });
          }
        });
        if ('caches' in window) {
          caches.keys().then((keys) => {
            keys.forEach((key) => {
              caches.delete(key).then(() => {
                console.log('[PWA] Cache supprimé en local:', key);
              });
            });
          });
        }
      } else {
        window.addEventListener('load', () => {
          // Relatif au dossier /shop/ (évite les 404 sur /assets et /sw.js à la racine)
          const swUrl = new URL('sw.js', window.location.href).pathname;
          navigator.serviceWorker.register(swUrl, { scope: new URL('.', window.location.href).pathname })
            .then((reg) => {
              console.log('[PWA] Service Worker enregistré avec succès:', reg.scope);
              reg.update().catch(() => {});
            })
            .catch((err) => console.error('[PWA] Échec de l\'enregistrement du Service Worker:', err));
        });
      }
    }
  </script>
</body>

</html>
